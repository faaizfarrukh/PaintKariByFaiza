<script src="https://cdn.tailwindcss.com"></script>

<body class="bg-white">
<div class="max-w-7xl mx-auto p-4">
<h1 class="text-3xl font-bold text-center my-6">PAINTKARI BY FAIZA</h1>
<p class="text-center mb-6">Handpainted Art & Resin Work</p>

<div id="cats" class="flex flex-wrap gap-2 justify-center mb-6"></div>
<div id="products" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
</div>

<script>
const WHATSAPP_NUMBER = "923422142565";
const CATEGORIES = ["All","Fabric Paint","Bedsheets","Paint Hangings","Resin Work","Wall Paintings"];

// Tumhare products yahan ayenge - tumhari purani file se copy kar lena
const PRODUCTS = [
 { id:1, cat:"Fabric Paint", name:"Handpainted Tulip Kurta Set", price:"Contact for Price", img:"https://i.ibb.co/sample.jpg" },
 // ... baki products yahan
];

let activeCat = "All";
function renderCats(){
 document.getElementById('cats').innerHTML = CATEGORIES.map(c=> 
  `<button onclick="filterCat('${c}')" class="px-4 py-2 rounded-full border ${activeCat===c?'bg-black text-white':'bg-white'}">${c}</button>`
 ).join('');
}
function filterCat(c){ activeCat=c; renderCats(); renderProducts(); }
function renderProducts(){
 let filtered = activeCat==="All" ? PRODUCTS : PRODUCTS.filter(p=>p.cat===activeCat);
 document.getElementById('products').innerHTML = filtered.map(p=> `
  <div class="border rounded-xl overflow-hidden shadow">
   <img src="${p.img}" class="w-full h-64 object-cover">
   <div class="p-3">
    <h3 class="font-bold">${p.name}</h3>
    <p class="text-sm text-gray-500">${p.cat}</p>
    <p class="my-2">${p.price}</p>
    <a href="https://wa.me/${WHATSAPP_NUMBER}?text=Salam! I want to order: ${p.name}" target="_blank" class="block bg-green-500 text-white text-center py-2 rounded">Order on WhatsApp</a>
   </div>
  </div>
 `).join('');
}
renderCats(); renderProducts();
</script>
</body>
